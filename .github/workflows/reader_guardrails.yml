name: Reader Guardrails

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reader/webapp/**'
      - 'pipeline/scripts/build_reader.py'
      - 'pipeline/scripts/reader_guardrails.py'
      - 'pipeline/tests/test_reader_guardrails.py'
      - 'pipeline/scripts/podcast_generator.py'
      - 'pipeline/scripts/podcast_description.py'
      - 'pipeline/scripts/molefm_submitter.py'
      - 'pipeline/scripts/generate_rss.py'
      - 'pipeline/tests/test_podcast_attribution.py'
      - 'pipeline/scripts/install_perplexity_generator.py'
      - 'pipeline/tests/test_perplexity_installer.py'
      - 'pipeline/config/sponsors.json'
      - '.github/workflows/reader_guardrails.yml'
  push:
    branches: [main]
    paths:
      - 'reader/webapp/**'
      - 'pipeline/scripts/build_reader.py'
      - 'pipeline/scripts/reader_guardrails.py'
      - 'pipeline/tests/test_reader_guardrails.py'
      - 'pipeline/scripts/podcast_generator.py'
      - 'pipeline/scripts/podcast_description.py'
      - 'pipeline/scripts/molefm_submitter.py'
      - 'pipeline/scripts/generate_rss.py'
      - 'pipeline/tests/test_podcast_attribution.py'
      - 'pipeline/scripts/install_perplexity_generator.py'
      - 'pipeline/tests/test_perplexity_installer.py'
      - 'pipeline/config/sponsors.json'
      - '.github/workflows/reader_guardrails.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/scripts
            pipeline/config
            pipeline/tests
            reader/webapp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test size boundary, direct URLs and embedded audio rejection offline
        run: python3 -m unittest discover -s pipeline/tests -p 'test_reader_guardrails.py' -v

      - name: Test episode source notes through publishing and RSS offline
        run: python3 -m unittest discover -s pipeline/tests -p 'test_podcast_attribution.py' -v

      - name: Test bounded Perplexity installation and rollback offline
        run: python3 -m unittest discover -s pipeline/tests -p 'test_perplexity_installer.py' -v

      - name: Render and validate the actual reader template without TTS
        run: python3 pipeline/scripts/reader_guardrails.py --render-fixture "$RUNNER_TEMP/molefm-reader/index.html"

      - name: Validate the generated artifact and local MP3s when committed
        run: |
          if [ -f reader/webapp/index.html ]; then
            python3 pipeline/scripts/reader_guardrails.py reader/webapp/index.html --check-local-audio
          else
            echo "No generated reader artifact committed; template checks ran above. The production generator validates every HTML output before writing."
          fi
